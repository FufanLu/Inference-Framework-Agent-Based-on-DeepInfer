name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    # Real services for the integration tests (Postgres store, Redis limiter,
    # Kafka job queue); the tests skip themselves when these are unset.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lev
          POSTGRES_PASSWORD: lev
          POSTGRES_DB: lev
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lev" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      kafka:
        image: apache/kafka:4.1.0
        ports: ["9092:9092"]
    env:
      LEV_TEST_DATABASE_URL: postgres://lev:lev@127.0.0.1:5432/lev
      LEV_TEST_REDIS_URL: redis://127.0.0.1:6379
      LEV_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -e 'worker[dev]'
      - run: make test-py

  engine:
    runs-on: ubuntu-latest
    env:
      TRITON_INTERPRET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU wheels: the tests run the reference kernels, and the Triton kernels
      # under TRITON_INTERPRET=1.
      - run: |
          python -m venv .venv
          .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          .venv/bin/pip install -e 'engine[dev,triton]'
      # Interpreter numerics run on the host's BLAS/SIMD; runners vary by CPU.
      - run: lscpu | grep -E 'Model name|Flags' | cut -c1-160
      - run: make test-engine
      - run: make test-rl

