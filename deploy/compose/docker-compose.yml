# One-command demo: docker compose -f deploy/compose/docker-compose.yml up --build
#   gateway     http://localhost:8080   (OpenAI / Anthropic compatible API, admin API)
#   prometheus  http://localhost:9090
#   grafana     http://localhost:3001   (anonymous, dashboard "Leviathan")
name: leviathan

x-sim-worker: &sim-worker
  build:
    context: ../..
    dockerfile: deploy/docker/worker.Dockerfile
  image: leviathan-worker:dev
  restart: unless-stopped

services:
  prefill-0:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, prefill-0, --role, prefill,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]
  prefill-1:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, prefill-1, --role, prefill,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]
  decode-0:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, decode-0, --role, decode,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]
  decode-1:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, decode-1, --role, decode,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    image: leviathan-gateway:dev
    command: [--config, /etc/leviathan/gateway.toml]
    volumes:
      - ./gateway.toml:/etc/leviathan/gateway.toml:ro
    ports:
      - "8080:8080"
    depends_on: [prefill-0, prefill-1, decode-0, decode-1]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/leviathan.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../dashboards/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]
