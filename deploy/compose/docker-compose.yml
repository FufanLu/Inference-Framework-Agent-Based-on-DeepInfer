# One-command demo: docker compose -f deploy/compose/docker-compose.yml up --build
#   gateway     http://localhost:8080   (OpenAI / Anthropic compatible API, admin API)
#   kafka       localhost:9094          (job queue; inside the network kafka:9092)
#   prometheus  http://localhost:9090
#   console     http://localhost:3000   (web console)
#   grafana     http://localhost:3001   (anonymous, dashboard "Leviathan")
name: leviathan

x-sim-worker: &sim-worker
  build:
    context: ../..
    dockerfile: deploy/docker/worker.Dockerfile
  image: leviathan-worker:dev
  restart: unless-stopped

services:
  prefill-0:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, prefill-0, --role, prefill,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]
  prefill-1:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, prefill-1, --role, prefill,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]
  decode-0:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, decode-0, --role, decode,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]
  decode-1:
    <<: *sim-worker
    command: [--backend, sim, --host, 0.0.0.0, --port, "50051", --worker-id, decode-1, --role, decode,
              --profile, h200-vllm, --tokenizer, /opt/leviathan/assets/tokenizers/v41/tokenizer.json]

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/gateway.Dockerfile
    image: leviathan-gateway:dev
    command: [--config, /etc/leviathan/gateway.toml]
    volumes:
      - ./gateway.toml:/etc/leviathan/gateway.toml:ro
    ports:
      - "8080:8080"
    depends_on:
      prefill-0: {condition: service_started}
      prefill-1: {condition: service_started}
      decode-0: {condition: service_started}
      decode-1: {condition: service_started}
      kafka: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  console:
    build:
      context: ../../apps/console
      args:
        VITE_GATEWAY_URL: http://localhost:8080
    image: leviathan-console:dev
    ports:
      - "3000:80"
    depends_on: [gateway]

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/leviathan.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../dashboards/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on: [prometheus]
