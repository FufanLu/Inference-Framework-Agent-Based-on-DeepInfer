<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" class="viz" role="img" aria-label="Burst makespan against interactive TTFT p99">
<style>
.viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e1;
       --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
@media (prefers-color-scheme: dark) {
  .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e88; --grid:#33332f;
         --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
}
.viz text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink2); font-size: 12px; }
.viz .title { fill: var(--ink); font-size: 15px; font-weight: 600; }
.viz .axis { stroke: var(--muted); stroke-width: 1; }
.viz .grid { stroke: var(--grid); stroke-width: 1; }
.viz .ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.viz .label { fill: var(--ink); font-size: 11.5px; }
</style>
<rect width="760" height="440" fill="var(--surface)"/>
<text x="76" y="24" class="title">A 2000-request burst: finish time vs. interactive TTFT p99</text>
<text x="76" y="42">4 sim replicas (h200-vllm profile), 8 interactive clients; labels: max_in_flight / max_queue_delay</text>
<line x1="76" x2="736" y1="382.0" y2="382.0" class="grid"/>
<text x="68" y="386.0" text-anchor="end">10 ms</text>
<line x1="76" x2="736" y1="308.0" y2="308.0" class="grid"/>
<text x="68" y="312.0" text-anchor="end">100 ms</text>
<line x1="76" x2="736" y1="234.0" y2="234.0" class="grid"/>
<text x="68" y="238.0" text-anchor="end">1 s</text>
<line x1="76" x2="736" y1="160.0" y2="160.0" class="grid"/>
<text x="68" y="164.0" text-anchor="end">10 s</text>
<line x1="76" x2="736" y1="86.0" y2="86.0" class="grid"/>
<text x="68" y="90.0" text-anchor="end">100 s</text>
<text x="76.0" y="400" text-anchor="middle">0 s</text>
<text x="186.0" y="400" text-anchor="middle">20 s</text>
<text x="296.0" y="400" text-anchor="middle">40 s</text>
<text x="406.0" y="400" text-anchor="middle">60 s</text>
<text x="516.0" y="400" text-anchor="middle">80 s</text>
<text x="626.0" y="400" text-anchor="middle">100 s</text>
<text x="736.0" y="400" text-anchor="middle">120 s</text>
<line x1="76" x2="736" y1="382" y2="382" class="axis"/>
<text x="406.0" y="426" text-anchor="middle">time for the whole burst to finish (lower is better)</text>
<text transform="translate(18 234.0) rotate(-90)" text-anchor="middle">interactive TTFT p99 (log)</text>
<line x1="76" x2="736" y1="336.9" y2="336.9" class="ref"/>
<text x="732" y="330.9" text-anchor="end">no burst: 40.7 ms</text>
<circle cx="309.2" cy="117.1" r="5.5" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"><title>direct direct: burst 42.4 s, TTFT p99 38047.4 ms</title></circle>
<text x="318.2" y="121.1" text-anchor="start" class="label">direct</text>
<circle cx="403.2" cy="281.5" r="5.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>jobs, priority 1 128 / 200 ms: burst 59.5 s, TTFT p99 228.1 ms</title></circle>
<text x="412.2" y="285.5" text-anchor="start" class="label">128 / 200 ms (both priorities)</text>
<circle cx="401.6" cy="280.0" r="5.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>jobs, priority 0 128 / 200 ms: burst 59.2 s, TTFT p99 239.2 ms</title></circle>
<circle cx="349.4" cy="261.8" r="5.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>jobs, priority 1 256 / 400 ms: burst 49.7 s, TTFT p99 420.7 ms</title></circle>
<text x="358.4" y="265.8" text-anchor="start" class="label">256 / 400 ms</text>
<circle cx="717.9" cy="307.0" r="5.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>jobs, priority 1 32 / 50 ms: burst 116.7 s, TTFT p99 103.2 ms</title></circle>
<text x="708.9" y="311.0" text-anchor="end" class="label">32 / 50 ms</text>
<circle cx="321.9" cy="254.7" r="5.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>jobs, priority 1 512 / 2000 ms: burst 44.7 s, TTFT p99 524.8 ms</title></circle>
<text x="312.9" y="258.7" text-anchor="end" class="label">512 / 2000 ms</text>
<circle cx="321.9" cy="210.4" r="5.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>jobs, priority 0 512 / 2000 ms: burst 44.7 s, TTFT p99 2087.1 ms</title></circle>
<text x="330.9" y="214.4" text-anchor="start" class="label">512 / 2000 ms</text>
<circle cx="505.5" cy="295.2" r="5.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>jobs, priority 1 64 / 100 ms: burst 78.1 s, TTFT p99 149 ms</title></circle>
<text x="514.5" y="299.2" text-anchor="start" class="label">64 / 100 ms</text>
<circle cx="81" cy="62" r="5" fill="var(--s1)"/>
<text x="91" y="66">jobs, priority 1</text>
<circle cx="231" cy="62" r="5" fill="var(--s2)"/>
<text x="241" y="66">jobs, priority 0</text>
<circle cx="381" cy="62" r="5" fill="var(--s3)"/>
<text x="391" y="66">direct</text>
</svg>
